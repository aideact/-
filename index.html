<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>亚罗士打斗母宫 - About</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar -->
    <div class="navbar">
        <div class="logo">亚罗士打斗母宫</div>
    </div>

    <div class="container">
        <div class="carousel-section">
            <h2>亚罗士打斗母宫</h2>
            
            <div class="carousel-container">
                <button class="carousel-btn prev">❮</button>
                
                <div class="carousel-slides">
                    <img src="images/1.jpg" class="slide active" alt="1">
                    <img src="images/2.jpg" class="slide" alt="2">
                    <img src="images/3.jpg" class="slide" alt="3">
                    <img src="images/4.jpg" class="slide" alt="4">
                    <img src="images/5.jpg" class="slide" alt="5">
                </div>
                
                <button class="carousel-btn next">❯</button>
            </div>

            <div class="carousel-dots"></div>
        </div>
    </div>

<div class="video-section">
                <h2>视频展示</h2>
                <h3>VIDEO 1</h3>
                <div class="video-container">
                    <iframe 
                        src="https://www.youtube.com/embed/XF4_XstP_mY?si=Fvw55nJ7lCsrlIX5" 
                        title="视频展示" 
                        frameborder="0" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen>
                    </iframe>
                    <h3>VIDEO 2</h3>
                    <iframe 
                        src="https://www.youtube.com/embed/uqJwNUuC7vI?si=E0OZc9HPLKoTP0uq" 
                        frameborder="0" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen>
                    </iframe>
                    <h3>VIDEO 3</h3>
                    <iframe 
                        src="https://www.youtube.com/embed/0AFpXJw6nEU?si=DGeVeYoqsrPHM4Ac" 
                        frameborder="0" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen>
                    </iframe>
                </div>
            </div>

    <div class="map-section">
    <h2>地图位置</h2>
    <div class="map-container">
        <img src="images/map1.png" alt="亚罗士打斗母宫地图" class="map-image">
    </div>
    <a href="https://maps.app.goo.gl/apAkLUTZ82QhEArKA" target="_blank" class="map-button">
        📍 查看地图导航
    </a>
</div>

<script src="script.js"></script>
</body>
</html>
